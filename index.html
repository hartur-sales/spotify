<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <script
      src="https://kit.fontawesome.com/bc4771d7d5.js"
      crossorigin="anonymous"></script>
    <title>Hartasfy</title>
  </head>
  <body>
    <div class="container">
      <nav>
        <div class="nav-logo">
          <i class="fa-brands fa-spotify"></i>
        </div>

        <div class="nav-library">
          <i class="fa-solid fa-bookmark"></i>
          <p>Sua biblioteca</p>
        </div>

        <div class="nav-playlists">
          <h4>Crie sua primeira playlist</h4>
          <button>Criar playlist</button>
        </div>

        <div class="nav-podcasts">
          <h4>Siga um podcast</h4>
          <p>Avisaremos você sobre novos episódios</p>
          <button>Explore podcasts</button>
        </div>

        <div class="nav-footer">
          <a href="#">© 2023 Hartasfy</a>
          <a href="#">Termos de uso</a>
          <a href="#">Privacidade</a>
          <a href="#">Cookies</a>
          <a href="#">Sobre anúncios</a>
          <a href="#">Acessibilidade</a>
        </div>

        <button class="nav-lang-button">
          <i class="fa-solid fa-globe"></i>
          Pt - Br
        </button>
      </nav>

      <main>
        <header>
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" placeholder="O que você quer ouvir?" />
        </header>

        <section class="content">
          <h2>Artistas populares</h2>
          <div class="artists-grid"></div>

          <h2>Álbuns populares</h2>
          <div class="albums-grid"></div>
        </section>
      </main>
    </div>
  </body>
</html>
